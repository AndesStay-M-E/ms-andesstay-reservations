server:
  port: 8081

spring:
  application:
    name: ms-andesstay-reservations

  profiles:
    default: local

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:andesstay}
    password: ${RABBITMQ_PASSWORD:andesstay_dev}
    virtual-host: /

    connection-timeout: 5s

    # Confirmación del broker y devolución de mensajes sin cola destino.
    # Los callbacks están en RabbitPublisherCallbacksConfig.
    publisher-confirm-type: correlated
    publisher-returns: true

    template:
      mandatory: true
      retry:
        enabled: true
        initial-interval: 1s
        max-interval: 5s
        multiplier: 2.0
        max-retries: 3

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_ISSUER_URI:https://login.microsoftonline.com/4fe52189-087c-4613-8660-500431cc0eb9/v2.0}

# =====================================================================
# Nombres de mensajería centralizados (MessagingProperties).
# Deben ser IGUALES en todos los microservicios.
# =====================================================================
andesstay:
  messaging:
    exchanges:
      commands: andesstay.commands
      events: andesstay.events
      dead-letter: andesstay.dlx

    # Prefijo de la routing key de eventos: reservation.<estado>
    event-routing-key-prefix: "reservation."

    routes:
      email:
        queue: notify.email.q
        routing-key: email.send
        dead-letter-queue: notify.email.dlq
      housekeeping:
        queue: catalog.housekeeping.q
        routing-key: housekeeping.ticket
        dead-letter-queue: catalog.housekeeping.dlq
      voucher:
        queue: report.voucher.q
        routing-key: voucher.gen
        dead-letter-queue: report.voucher.dlq
      audit:
        queue: audit.reservation.q
        routing-key: "reservation.#"
        dead-letter-queue: audit.reservation.dlq

# Tokens are accepted only when intended for AndesStay API.
andesstay-security:
  allowed-audiences: ${AZURE_ALLOWED_AUDIENCES:85237aa5-9ece-48d3-8767-9698df0efefa,api://85237aa5-9ece-48d3-8767-9698df0efefa}
